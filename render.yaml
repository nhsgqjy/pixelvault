services:
  - type: web
    name: pixelvault
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PIXELVAULT_DEMO_PASSWORD
        sync: false
      - key: PIXELVAULT_COOKIE_SECURE
        value: "true"
      - key: PIXELVAULT_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: DATABASE_URL
        fromDatabase:
          name: pixelvault-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

databases:
  - name: pixelvault-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
